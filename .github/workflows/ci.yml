name: Kwaliteitspoort

on:
  pull_request:
    # `edited` staat er bewust bij. Twee guards lezen een bevestigingsregel uit de
    # PR-tekst ("Geen tests nodig: ..." en "Bevestigd: destructieve migratie").
    # Zonder `edited` zou je die regel kunnen toevoegen zonder dat er iets opnieuw
    # draait, en bleef de check rood tot je een lege commit pushte.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Snelle controles: geen database nodig, klaar in ongeveer een minuut.
  checks:
    name: Code
    runs-on: ubuntu-latest
    env:
      # De guards lezen de PR-tekst voor hun expliciete bevestigingsregels.
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Volledige historie: de guards vergelijken met de basisbranch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecontrole
        run: pnpm typecheck

      - name: Opmaak en lint
        run: pnpm lint

      - name: Unittests
        run: pnpm test

      - name: Bouwt het echt
        run: pnpm build

      - name: Guard - geheimen in repo en bundel
        run: pnpm guard:secrets

      - name: Guard - verstopte typefouten
        run: pnpm guard:escapes

      - name: Guard - row level security op elke tabel
        run: pnpm guard:rls

      - name: Guard - tests bij gewijzigde code
        run: pnpm guard:tests

      - name: Guard - destructieve migraties
        run: pnpm guard:migrations

  # Alles wat een echte database nodig heeft. Draait tegen een lokale Supabase,
  # dus zonder sleutels van een cloudomgeving en zonder iets aan te raken wat leeft.
  #
  # Heeft de app geen database (`database: false` in stack.config.json), dan slaan
  # de Supabase-stappen zichzelf over en blijven alleen de browsertests over. De job
  # zelf blijft dan wél draaien: hij staat als verplichte check in de ruleset, en een
  # job die in zijn geheel wordt overgeslagen laat die check hangen.
  database:
    name: Database en end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Doet de databaselaag mee?
        id: stack
        run: |
          aan=$(node -e "import('./scripts/lib/stack-config.mjs').then((m) => console.log(m.heeftDatabase()))")
          echo "database=$aan" >> "$GITHUB_OUTPUT"
          if [ "$aan" = "true" ]; then
            echo "::notice::Databaselaag staat aan: migraties, typecontrole en RLS-tests draaien."
          else
            echo "::notice::Deze app heeft geen database. Alleen de end-to-end test draait."
          fi

      - name: Supabase starten (draait meteen alle migraties)
        if: steps.stack.outputs.database == 'true'
        run: pnpm exec supabase start

      - name: Omgevingsvariabelen schrijven
        if: steps.stack.outputs.database == 'true'
        run: pnpm env:local

      - name: Databasetypes lopen gelijk met het schema
        if: steps.stack.outputs.database == 'true'
        run: pnpm db:types:check

      - name: RLS-tests
        if: steps.stack.outputs.database == 'true'
        run: pnpm test:rls

      - name: Browser installeren
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm test:e2e

      - name: Rapport bewaren als er iets faalde
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 7
